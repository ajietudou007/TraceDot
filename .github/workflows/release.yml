name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要上传到的 Release 标签（留空则用当前 ref）"
        required: false
        default: ""
      target:
        description: "只重出部分平台的包（避免覆盖已发布的另一平台产物）"
        type: choice
        options:
          - both
          - win
          - mac
        default: both

permissions:
  contents: write

jobs:
  build-win:
    name: Windows 安装包
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'win' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 标签与包内版本必须一致：此前 v5.4.1 标签指向的是 package.json 仍为 5.3.0 的提交，
      # CI 打出来的 5.3.0 资产覆盖了 latest.yml，electron-updater 就会把版本号读错。
      - name: 校验版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: desktop
        run: |
          v=$(node -p "require('./package.json').version")
          echo "desktop/package.json = $v / tag = ${GITHUB_REF_NAME}"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "标签与 desktop/package.json 版本不一致，拒绝构建（避免覆盖 Release 的更新清单）"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: desktop

      - name: Build Windows installer
        run: npm run prep && npx electron-builder --win --publish never
        working-directory: desktop

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TraceDot-win
          path: |
            desktop/dist_electron/TraceDot-Setup-*.exe
            desktop/dist_electron/latest.yml

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          overwrite_files: true
          files: |
            desktop/dist_electron/TraceDot-Setup-*.exe
            desktop/dist_electron/latest.yml
          fail_on_unmatched_files: false

  build-mac:
    name: macOS 安装包
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'mac' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        run: |
          v=$(node -p "require('./package.json').version")
          echo "desktop/package.json = $v / tag = ${GITHUB_REF_NAME}"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "标签与 desktop/package.json 版本不一致，拒绝构建（避免覆盖 Release 的更新清单）"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: desktop

      - name: Build macOS dmg + zip
        run: npm run prep && npx electron-builder --mac --publish never
        working-directory: desktop

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TraceDot-mac
          path: |
            desktop/dist_electron/*.dmg
            desktop/dist_electron/*.zip
            desktop/dist_electron/latest-mac.yml

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          overwrite_files: true
          files: |
            desktop/dist_electron/*.dmg
            desktop/dist_electron/*.zip
            desktop/dist_electron/latest-mac.yml
          fail_on_unmatched_files: false
